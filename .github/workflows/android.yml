name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: assembleRelease
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Conferir APK
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -ls
          test -n "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: AlongamentoDeTela
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
