name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android command-line tools
        run: |
          set -euo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "${SDK_ROOT}/cmdline-tools"
          mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          echo "sdk.dir=${SDK_ROOT}" > local.properties

      - name: SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
          sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: assembleRelease
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Conferir APK
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -ls
          test -n "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: AlongamentoDeTela
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
